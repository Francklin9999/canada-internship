<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Intern Radar — Canada’s early-career opportunity tracker</title>
  <desc id="hero-description">A navy banner with Intern Radar typography, Canadian job-search highlights, and a red maple leaf at the centre of a radar display.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1190" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152C"/>
      <stop offset="0.55" stop-color="#0B2342"/>
      <stop offset="1" stop-color="#071A33"/>
    </linearGradient>
    <radialGradient id="radar-glow" cx="0" cy="0" r="1" gradientTransform="translate(1044 201) rotate(90) scale(185)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3DD7C8" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#2AB7AC" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#2AB7AC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="1048" y1="200" x2="1168" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#57E0D1" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#57E0D1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="maple" x1="1012" y1="136" x2="1086" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF615D"/>
      <stop offset="1" stop-color="#D72836"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B7CCEA" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="400" rx="28"/>
    </clipPath>
    <clipPath id="radar-disc">
      <circle cx="1048" cy="200" r="138"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#background)"/>
    <rect width="1280" height="400" fill="url(#grid)"/>
    <circle cx="1048" cy="200" r="210" fill="url(#radar-glow)"/>
    <path d="M0 318C187 271 346 344 537 300C718 258 800 176 965 166C1087 158 1183 191 1280 158V400H0Z" fill="#071326" fill-opacity="0.62"/>
    <path d="M0 318C187 271 346 344 537 300C718 258 800 176 965 166C1087 158 1183 191 1280 158" fill="none" stroke="#6FD6CE" stroke-opacity="0.12"/>

    <g fill="#D5E8FF">
      <circle cx="83" cy="72" r="2" opacity="0.45"/>
      <circle cx="224" cy="338" r="2" opacity="0.28"/>
      <circle cx="421" cy="62" r="1.5" opacity="0.4"/>
      <circle cx="740" cy="82" r="2" opacity="0.3"/>
      <circle cx="815" cy="322" r="1.5" opacity="0.35"/>
      <circle cx="1210" cy="64" r="2" opacity="0.35"/>
      <circle cx="1235" cy="340" r="1.5" opacity="0.28"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g transform="translate(78 64)">
        <rect width="267" height="32" rx="16" fill="#132F52" stroke="#315777"/>
        <circle cx="17" cy="16" r="5" fill="#47D7C8" filter="url(#soft-glow)"/>
        <text x="31" y="21" fill="#BBD4ED" font-size="13" font-weight="700" letter-spacing="1.6">CANADA-WIDE JOB SIGNAL</text>
      </g>

      <text x="74" y="177" fill="#F5F9FF" font-size="70" font-weight="780" letter-spacing="-2.8">INTERN</text>
      <text x="340" y="177" fill="#FF5757" font-size="70" font-weight="780" letter-spacing="-2.8">RADAR</text>
      <text x="78" y="220" fill="#B9CAE0" font-size="22" font-weight="450">Canadian internships and new-grad roles.</text>
      <text x="78" y="252" fill="#8099B7" font-size="17">Focused signals. Direct application links. Less searching.</text>

      <g transform="translate(78 294)">
        <rect width="155" height="42" rx="21" fill="#0D294A" stroke="#294C6B"/>
        <path d="M23 12V30M14 21H32" stroke="#FF5A5F" stroke-width="2" stroke-linecap="round"/>
        <text x="43" y="27" fill="#D9E7F6" font-size="13" font-weight="700" letter-spacing="0.7">CANADA ONLY</text>
      </g>
      <g transform="translate(247 294)">
        <rect width="158" height="42" rx="21" fill="#0D294A" stroke="#294C6B"/>
        <path d="M18 25L25 18L31 24" fill="none" stroke="#49D8C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M25 18V30" stroke="#49D8C9" stroke-width="2" stroke-linecap="round"/>
        <text x="43" y="27" fill="#D9E7F6" font-size="13" font-weight="700" letter-spacing="0.7">DIRECT APPLY</text>
      </g>
      <g transform="translate(419 294)">
        <rect width="170" height="42" rx="21" fill="#0D294A" stroke="#294C6B"/>
        <path d="M17 22A8 8 0 1 0 20 15" fill="none" stroke="#F3C969" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 12L21 14L19 19" fill="none" stroke="#F3C969" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="43" y="27" fill="#D9E7F6" font-size="13" font-weight="700" letter-spacing="0.7">AUTO-CHECKED</text>
      </g>
    </g>

    <g clip-path="url(#radar-disc)">
      <circle cx="1048" cy="200" r="138" fill="#081B32" fill-opacity="0.72"/>
      <path d="M1048 200L1172 72A178 178 0 0 1 1217 170Z" fill="url(#scan)"/>
      <path d="M910 200H1186M1048 62V338" stroke="#8BE5DD" stroke-opacity="0.22"/>
      <path d="M950 102L1146 298M1146 102L950 298" stroke="#8BE5DD" stroke-opacity="0.07"/>
    </g>
    <g fill="none" stroke="#60D8CF">
      <circle cx="1048" cy="200" r="138" stroke-opacity="0.6" stroke-width="2"/>
      <circle cx="1048" cy="200" r="101" stroke-opacity="0.22"/>
      <circle cx="1048" cy="200" r="64" stroke-opacity="0.27"/>
      <circle cx="1048" cy="200" r="27" stroke-opacity="0.36"/>
    </g>
    <path d="M1048 62A138 138 0 0 1 1186 200" fill="none" stroke="#7BEADF" stroke-width="3" stroke-linecap="round"/>

    <g fill="#7BEADF" filter="url(#soft-glow)">
      <circle cx="1121" cy="118" r="4"/>
      <circle cx="1158" cy="230" r="3"/>
      <circle cx="979" cy="282" r="3"/>
    </g>
    <g fill="#FF5B60" filter="url(#soft-glow)">
      <circle cx="955" cy="157" r="3.5"/>
      <circle cx="1087" cy="292" r="3"/>
    </g>

    <g>
      <circle cx="1048" cy="200" r="55" fill="#0A203A" stroke="#315A78" stroke-width="2"/>
      <path d="M1048 130L1060 162L1088 148L1079 178L1110 184L1085 202L1096 229L1062 220L1066 252L1048 243L1030 252L1034 220L1000 229L1011 202L986 184L1017 178L1008 148L1036 162Z" fill="url(#maple)"/>
      <path d="M1044 239H1052V270H1044Z" fill="#D72836"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="945" y="374" fill="#6684A4" font-size="11" font-weight="700" letter-spacing="2.4">TRACKING THE NEXT OPPORTUNITY</text>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="398" rx="27" fill="none" stroke="#365371" stroke-opacity="0.65" stroke-width="2"/>
</svg>
